name: PR build check (Compile against Java 27 using Maven)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Set up Java 27 (Oracle)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # 6.1.0
        with:
          distribution: 'oracle'
          java-version: '27'
          cache: maven

      - name: Maven clean install (compile only)
        run: mvn -B -ntp -DskipTests clean install

      - name: Test run (fail on runtime exceptions)
        id: demo-run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$(pwd)/tmp"
      
          java --enable-preview --add-modules=jdk.incubator.vector \
               -jar target/JavaDemos-27.0.jar > run.log 2>&1 || {
            echo "Non-zero exit code:"
            cat run.log
            exit 1
          }

      - name: Upload run.log on runtime failure
        if: steps.demo-run.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: run-log
          path: run.log
